<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pookiemon Pack Opening</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- PACK OPENING -->
<div id="pack-screen" class="screen">

  <div id="pack" class="pack">

    <img src="assets/cards/pack.png" alt="Pokemon Pack">

    <div class="pack-shine"></div>

    <div class="pack-glare"></div>

  </div>

  <p class="pack-instruction">
    Tap me!
  </p>

</div>


  <!-- CARD REVEAL -->
  <div id="reveal-screen" class="screen hidden">

    <div id="card-stack">

      <div class="reveal-card card-1">
        <img src="assets/cards/card1.png" alt="Card 1">

        <div class="holo"></div>
        <div class="glare"></div>
      </div>

      <div class="reveal-card card-2">
        <img src="assets/cards/card2.png" alt="Card 2">

        <div class="holo"></div>
        <div class="glare"></div>
      </div>

      <div class="reveal-card card-3">
        <img src="assets/cards/card3.png" alt="Card 3">

        <div class="holo"></div>
        <div class="glare"></div>
      </div>

    </div>

     <!--<p id="reveal-instruction">
      Tap me!
    </p> -->

  </div>


  <!-- FINAL DECK -->
  <div id="deck-screen" class="screen hidden">

    <h1>Happy birthday !! <br> I love you !! </h1>

    <div id="deck">

      <div class="deck-card">
        <img src="assets/cards/card1.png" alt="Card 1">

        <div class="holo"></div>
        <div class="glare"></div>
      </div>

      <div class="deck-card">
        <img src="assets/cards/card3.png" alt="Card 2">

        <div class="holo"></div>
        <div class="glare"></div>
      </div>

      <div class="deck-card">
        <img src="assets/cards/card2.png" alt="Card 3">

        <div class="holo"></div>
        <div class="glare"></div>
      </div>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
